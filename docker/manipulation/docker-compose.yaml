name: manipulation

services:
  manipulation:
    container_name: manipulation
    image: ${ROBOTNIK_SIMULATION_IMAGE:-robotnik/simulation-gz:jazzy}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        USER_UID: ${LOCAL_UID:-1000}
        USER_GID: ${LOCAL_GID:-1000}
    network_mode: host
    ipc: host
    privileged: true
    stdin_open: true
    tty: true
    environment:
      DISPLAY: ${DISPLAY}
      ROS_DISTRO: jazzy
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-30}
      WORKSPACE_DIR: /opt/robotnik_ws
      RUNTIME_AUTOSTART: ${RUNTIME_AUTOSTART:-true}
      ROBOTNIK_ENV_FILE: /opt/robotnik/config/env/robot.env
      ROBOTNIK_LAUNCH_PACKAGE: ${ROBOTNIK_LAUNCH_PACKAGE:-robotnik_simulation_moveit}
      ROBOTNIK_LAUNCH_FILE: ${ROBOTNIK_LAUNCH_FILE:-moveit.launch.py}
      ROBOTNIK_LAUNCH_ARGS: ${ROBOTNIK_LAUNCH_ARGS:-robot_id:=robot robot:=rbkairos robot_model:=rbkairos_plus arm_type:=ur10e use_sim_time:=true run_moveit_rviz:=true}
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ../../env/robot.env:/opt/robotnik/config/env/robot.env:ro
      - /tmp/.X11-unix:/tmp/.X11-unix
